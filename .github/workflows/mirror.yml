name: Mirror books

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # monthly, picks up newly added books

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Download books and upload to releases
        # Leave time for the catalog commit so a long run can resume next time.
        timeout-minutes: 320
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/mirror.py

      - name: Commit catalog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md catalog.json || true
          git diff --cached --quiet || git commit -m "Update catalog"
          git push
